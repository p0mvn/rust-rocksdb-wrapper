name: Publish wrapper crate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Exact zakura-rocksdb version to verify or publish
        required: true
        type: string
      mode:
        description: Verify packaging, or publish the verified version
        type: choice
        default: verify
        options: [verify, publish]

permissions: {}

concurrency:
  group: publish-wrapper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify wrapper publication
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.97.1
      - name: Check the requested version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "zakura-rocksdb") | .version')
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$version" != "$REQUESTED_VERSION" ]; then
            echo 'The requested version does not match Cargo.toml.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check formatting
        run: cargo fmt --check -p zakura-rocksdb
      - name: Check the wrapper and its tests
        run: cargo check --locked -p zakura-rocksdb --tests
      - name: Check the file age option
        run: cargo test --locked -p zakura-rocksdb --test test_rocksdb_options test_set_ttl -- --exact
      - name: Verify the registry package
        run: cargo publish --locked --dry-run -p zakura-rocksdb

  publish:
    name: Publish verified wrapper
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the default branch
        env:
          SOURCE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$SOURCE_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo 'Publish only from the merged default branch.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: 1.97.1
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish the verified package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify -p zakura-rocksdb
