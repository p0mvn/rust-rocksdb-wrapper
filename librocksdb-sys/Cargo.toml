[package]
name = "zakura-librocksdb-sys"
version = "0.17.7+10.4.2"
edition = "2021"
rust-version = "1.97"
authors = [
    "Karl Hobley <karlhobley10@gmail.com>",
    "Arkadiy Paronyan <arkadiy@ethcore.io>",
]
license = "MIT/Apache-2.0/BSD-3-Clause"
description = "Native bindings to librocksdb (zakura fork of librocksdb-sys with a unity-build C++ compile)"
readme = "README.md"
repository = "https://github.com/zakura-core/rust-rocksdb-wrapper"
keywords = ["bindings", "ffi", "rocksdb"]
categories = ["api-bindings", "database", "external-ffi-bindings"]
links = "rocksdb"
# RocksDB's website sources (11 MB of pages and images) are not needed to
# build and would push the package past the crates.io size limit. Snappy's
# nested submodules (Google benchmark and googletest) are never compiled, but a
# recursive submodule checkout would otherwise package them.
exclude = ["rocksdb/docs/", "snappy/third_party/"]

[lib]
# Keep the upstream crate name so `rocksdb` and downstream code are unchanged.
name = "librocksdb_sys"

[features]
default = ["static", "full"]
jemalloc = ["tikv-jemalloc-sys"]
static = ["libz-sys?/static", "bzip2-sys?/static"]
# The bindings are committed in `src/bindings.rs`, so the build no longer runs
# bindgen. These features are kept so existing dependents still build.
bindgen-runtime = []
bindgen-static = []
mt_static = []
full = []
io-uring = ["pkg-config"]
snappy = []
lz4 = ["lz4-sys"]
zstd = ["zstd-sys"]
zlib = ["libz-sys"]
bzip2 = ["bzip2-sys"]
rtti = []
lto = []

[dependencies]
libc = "0.2"
tikv-jemalloc-sys = { version = "0.6", features = [
    "unprefixed_malloc_on_supported_platforms",
], optional = true }
lz4-sys = { version = "1.10", optional = true }
zstd-sys = { version = "2.0", default-features = false, features = [
    "legacy",
    "zdict_builder",
], optional = true }
libz-sys = { version = "1.1", default-features = false, optional = true }
bzip2-sys = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
uuid = { version = "1.0", features = ["v4"] }

[build-dependencies]
cc = { version = "1.0", features = ["parallel"] }
pkg-config = { version = "0.3", optional = true }
